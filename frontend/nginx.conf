server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Мини-апп открывается внутри MAX во фрейме - запрет фреймов сломал бы его.
    # Поэтому X-Frame-Options здесь сознательно не выставляется.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хэшированные ассеты неизменяемы - кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API проксируется на бэкенд: мини-апп и API на одном origin,
    # поэтому CORS не нужен вовсе.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка документов: держим запас по размеру и времени.
        # 30 МБ файлов версии плюс служебные данные multipart-запроса.
        client_max_body_size 32m;
        proxy_read_timeout 120s;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
