name: CI

# Сборка и тесты на каждом PR. Это автоматическая часть ревью: ревьюеру не нужно
# проверять руками, что проект вообще собирается.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Образ с зеркала Docker Hub (тот же digest, что у compose.yaml): у public.ecr.aws на общих раннерах бывает лимит трафика.
    # Настоящий PostgreSQL: без него пропускаются тесты схемы, входа и подключения компании,
    # и CI ни разу не поднимает бэкенд целиком. Пароль одноразовый, база живёт только в этом прогоне.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: schema_test
          POSTGRES_USER: schema_test
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_test -d schema_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SCHEMA_TEST_URL: jdbc:postgresql://localhost:5432/schema_test
      SCHEMA_TEST_PASSWORD: ci-only-throwaway
      # Клиент MinIO требует ключи при создании, к серверу при старте не обращается.
      MINIO_ACCESS_KEY: ci-access
      MINIO_SECRET_KEY: ci-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Сборка и тесты
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей строго по lock-файлу
        run: npm ci --no-audit --no-fund
      - name: Проверка типов и сборка
        run: npm run build
      - name: Тесты навигации и экранов
        run: npm test

  testdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: testdata/requirements.txt
      - name: Зависимости генератора
        run: pip install -r testdata/requirements.txt
      # Правила, тестовые документы и docs/RULES.md совпадают с генератором.
      - name: Тестовые данные актуальны
        run: python testdata/generate.py --check
